name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  components:
    name: components (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: hello-nav
        working-directory: components/hello-nav
        run: |
          cargo fmt --check
          cargo clippy --release --target wasm32-wasip2 -- -D warnings
          cargo build --release --target wasm32-wasip2
      - name: hello-aggregator
        working-directory: components/hello-aggregator
        run: |
          cargo fmt --check
          cargo clippy --release --target wasm32-wasip2 -- -D warnings
          cargo build --release --target wasm32-wasip2
      - name: vault-nav
        working-directory: components/vault-nav
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --release --target wasm32-wasip2 -- -D warnings
          cargo test
          cargo build --release --target wasm32-wasip2

  workspace:
    name: workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
