<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2FEE"/>
      <stop offset=".42" stop-color="#2B5CFF"/>
      <stop offset=".78" stop-color="#6FA5FF"/>
      <stop offset="1" stop-color="#C6E6FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/>
    </linearGradient>
    <filter id="bloomblur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="glyphshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#0C2AA8" flood-opacity=".45"/>
    </filter>
    <clipPath id="sq"><rect x="3" y="3" width="58" height="58" rx="15"/></clipPath>
  </defs>

  <!-- stacked glass echo frames -->
  <rect x="0.8" y="0.8" width="62.4" height="62.4" rx="17" fill="#7FB2FF" opacity=".28"/>
  <rect x="1.9" y="1.9" width="60.2" height="60.2" rx="16" fill="#9CC5FF" opacity=".38"/>

  <!-- tile -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#tile)"/>

  <!-- glass body light -->
  <g clip-path="url(#sq)">
    <rect x="3" y="3" width="58" height="34" fill="url(#gloss)"/>
    <ellipse cx="32" cy="67" rx="38" ry="18" fill="#FFFFFF" opacity=".3" filter="url(#bloomblur)"/>
  </g>

  <!-- inner rim -->
  <rect x="3.6" y="3.6" width="56.8" height="56.8" rx="14.5" fill="none" stroke="url(#rim)" stroke-width="1.1" opacity=".55"/>

  <!-- infinity glyph, inflated -->
  <g filter="url(#glyphshadow)">
    <path d="M32 32 C26 21 11 21 11 32 C11 43 26 43 32 32 C38 21 53 21 53 32 C53 43 38 43 32 32Z"
          fill="none" stroke="#FFFFFF" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M32 32 C26 21 11 21 11 32 C11 43 26 43 32 32 C38 21 53 21 53 32 C53 43 38 43 32 32Z"
        fill="none" stroke="#F2F8FF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
</svg>
