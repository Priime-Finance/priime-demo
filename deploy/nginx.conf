# Ingress for the loop server (apps/loop-server). The server itself binds
# 127.0.0.1 only; nginx terminates TLS and forwards. Auth is a bearer token
# checked by the app, not here, so the config stays credential-free.
#
# Adjust server_name and certificate paths per environment.

server {
    listen 443 ssl;
    server_name loops.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # Loop configs are small JSON documents.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # loop deploys wait for tx receipts
    }
}

server {
    listen 80;
    server_name loops.example.com;
    return 301 https://$host$request_uri;
}
